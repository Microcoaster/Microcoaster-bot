name: CI

# Le dépôt a une configuration ESLint et Prettier que rien n'exécutait.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  qualite:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique
        run: npx eslint .

      - name: Vérifier la syntaxe de chaque fichier
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
